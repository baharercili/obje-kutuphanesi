<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Model indir · Obje Kütüphanesi</title><link rel="stylesheet" href="./hipicon.css"></head><body><main style="max-width:700px;margin:10vh auto;padding:32px"><p class="eyebrow">Obje Kütüphanesi</p><h1>Tam model dosyası</h1><p id="status" role="status">İndirme hazırlanıyor…</p><p><a id="download" hidden>GLB dosyasını indir ↗</a></p><a href="./index.html">Koleksiyona dön</a></main><script type="module">try{const id=new URLSearchParams(location.search).get('model');const response=await fetch('./full-model-index.json');if(!response.ok)throw Error();const item=(await response.json())[id];if(!item)throw Error();document.getElementById('status').textContent='Geometri ve yüzey malzemelerini içeren tam GLB dosyan hazır.';const a=document.getElementById('download');a.href=item.download_url;a.hidden=false;a.textContent=item.filename+' ↗';location.replace(item.download_url);}catch{document.getElementById('status').textContent='Model bulunamadı. Koleksiyondan yeniden seçebilirsin.';}</script></body></html>
