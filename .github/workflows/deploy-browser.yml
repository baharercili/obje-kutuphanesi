name: Publish browser app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-library-publication
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.nojekyll
            /app.js
            /catalog.json
            /collection-catalog.json
            /collection-data.js
            /collection.css
            /collection.js
            /coverage-inventory.json
            /download.html
            /full-model-index.json
            /hipicon-reference-catalog.json
            /hipicon.css
            /hipicon.html
            /hipicon.js
            /hmhome-catalog.json
            /hmhome-discovered.json
            /hmhome-envanter.html
            /hmhome-inventory.css
            /hmhome-inventory.js
            /hmhome-inventory.json
            /hmhome-preview.json
            /hmhome-sources.json
            /hmhome.html
            /hmhome.js
            /index.html
            /model-assets.json
            /model-transport.js
            /physical-glass-renders.json
            /physical-render-gallery.css
            /physical-render-gallery.js
            /preview.json
            /reference-gallery.js
            /style.css
            /viewer.js
            /zarahome-reference-catalog.json
            /zarahome-secki.html
            /zarahome-secki.js
            /zarahome.html
            /publish-receipt.json
            /.github/pages-site-manifest.json
            /.github/scripts/build-pages.py
      - name: Verify and package the published browser app
        run: python3 .github/scripts/build-pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish the browser app
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: '1800000'
