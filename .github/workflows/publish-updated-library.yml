name: Publish updated library
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: complete-library-publication
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/models/
      - name: Verify and package the updated library
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil
          root=pathlib.Path('.')
          idx=json.loads((root/'full-model-index.json').read_text())
          rows=json.loads((root/'catalog.json').read_text())+json.loads((root/'hmhome-catalog.json').read_text())
          assert len(idx)==len(rows)==2147
          assert not any(x['category'] in {'Ev tekstili','Battaniye ve örtüler','Perdeler'} for x in rows)
          assert sum(x['category']=='Halılar' for x in rows)==189
          assert sum(x['category']=='Kırlentler' for x in rows)==323
          assert set(idx)=={x['id'] for x in rows}
          names='.nojekyll app.js catalog.json collection-catalog.json collection-data.js collection.css collection.js coverage-inventory.json download.html full-model-index.json hipicon-reference-catalog.json hipicon.css hipicon.html hipicon.js hmhome-catalog.json hmhome-discovered.json hmhome-envanter.html hmhome-inventory.css hmhome-inventory.js hmhome-inventory.json hmhome-preview.json hmhome-sources.json hmhome.html hmhome.js index.html model-assets.json model-transport.js physical-glass-renders.json physical-render-gallery.css physical-render-gallery.js preview.json reference-gallery.js style.css viewer.js zarahome-reference-catalog.json zarahome-secki.html zarahome-secki.js zarahome.html publish-receipt.json textile-removal.json'.split()
          site=root/'_site';site.mkdir()
          for name in names:shutil.copy2(root/name,site/name)
          print('Verified2147models;189rugsand323cushionspreserved')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
